<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Achievements</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:white;background:
radial-gradient(circle at 8% 8%,rgba(0,190,255,.15),transparent 28%),
radial-gradient(circle at 92% 28%,rgba(160,70,255,.15),transparent 30%),#03050d}
.navbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1050px)/2));background:rgba(3,5,13,.82);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px)}
.logo{font-size:25px;font-weight:950;letter-spacing:3px;background:linear-gradient(90deg,#4edcff,#9270ff,#ed6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.back{color:rgba(255,255,255,.65);text-decoration:none;padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}
.page{width:min(1050px,92%);margin:auto;padding:42px 0 80px}
.hero{padding:30px;border-radius:25px;background:linear-gradient(135deg,rgba(0,190,255,.12),rgba(120,70,255,.13));border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 65px rgba(0,0,0,.25);animation:up .6s ease-out}
@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.hero h1{font-size:38px;background:linear-gradient(90deg,#fff,#7ce5ff,#d38cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;color:rgba(255,255,255,.48)}
.counter{margin-top:18px;color:#9bdfff;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:25px}
.badge{padding:24px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);box-shadow:0 15px 35px rgba(0,0,0,.18);transition:.25s}
.badge:hover{transform:translateY(-5px);border-color:rgba(150,130,255,.25)}
.badge.locked{opacity:.45;filter:saturate(.5)}
.icon{font-size:34px;margin-bottom:16px}
.badge h3{font-size:17px}
.badge p{margin-top:7px;color:rgba(255,255,255,.42);font-size:12px;line-height:1.5}
.status{display:inline-block;margin-top:17px;padding:6px 10px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:.5px;background:rgba(60,220,150,.1);color:#79efbd;border:1px solid rgba(70,220,160,.18)}
.locked .status{background:rgba(255,255,255,.05);color:rgba(255,255,255,.38);border-color:rgba(255,255,255,.08)}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body>
<nav class="navbar">
    <div class="logo">NEXORA</div>
    <a href="/profile" class="back">← Profile</a>
</nav>

<main class="page">
    <section class="hero">
        <h1>🏆 Achievements</h1>
        <p>Keep using NEXORA and unlock new milestones.</p>
        <div class="counter">{{ unlocked_count }} / {{ total_count }} unlocked</div>
    </section>

    <section class="grid">
        {% for badge in badges %}
        <div class="badge {% if not badge.unlocked %}locked{% endif %}">
            <div class="icon">{{ badge.icon }}</div>
            <h3>{{ badge.title }}</h3>
            <p>{{ badge.text }}</p>
            <span class="status">
                {% if badge.unlocked %}UNLOCKED ✓{% else %}LOCKED 🔒{% endif %}
            </span>
        </div>
        {% endfor %}
    </section>
</main>
</body>
</html>
