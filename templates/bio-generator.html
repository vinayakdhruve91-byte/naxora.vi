<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Bio Generator | NEXORA</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="logo">
        NEXORA
    </div>

    <div class="nav-links">

        <a href="/creator-tools">
            Creator Tools
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


<main class="creator-tool-page">


    <div class="creator-tool-header">

        <p class="welcome-text">
            NEXORA AI CREATOR LAB
        </p>

        <h1>
            AI Bio Generator 👤
        </h1>

        <p>
            Create professional and unique social-media bios.
        </p>

    </div>


    <div class="generator-layout">


        <!-- INPUT PANEL -->

        <div class="generator-card">


            <div class="input-group">

                <label>
                    Platform
                </label>

                <select id="platform">

                    <option value="Instagram">
                        Instagram
                    </option>

                    <option value="YouTube">
                        YouTube
                    </option>

                    <option value="Facebook">
                        Facebook
                    </option>

                    <option value="TikTok">
                        TikTok
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    maxlength="100"
                    placeholder="@yourusername"
                >

            </div>


            <div class="input-group">

                <label>
                    Your Niche
                </label>

                <input
                    id="niche"
                    type="text"
                    maxlength="200"
                    placeholder="Example: Gaming, Fitness, Education"
                >

            </div>


            <div class="input-group">

                <label>
                    Bio Style
                </label>

                <select id="style">

                    <option value="Professional">
                        💼 Professional
                    </option>

                    <option value="Cool">
                        😎 Cool
                    </option>

                    <option value="Funny">
                        😂 Funny
                    </option>

                    <option value="Minimal">
                        ✨ Minimal
                    </option>

                    <option value="Creator">
                        🎬 Creator
                    </option>

                    <option value="Motivational">
                        🚀 Motivational
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label>
                    Extra Information
                </label>

                <textarea
                    id="extra"
                    rows="4"
                    maxlength="500"
                    placeholder="Example: I make gaming videos and funny reels."
                ></textarea>

            </div>


            <button
                id="generateBtn"
                class="calculate-btn"
                onclick="generateBio()"
            >
                ✨ Generate AI Bios
            </button>


        </div>



        <!-- RESULT PANEL -->

        <div class="generator-result">


            <div class="result-header">

                <span>
                    AI GENERATED BIOS
                </span>

                <button
                    class="copy-btn"
                    onclick="copyBios()"
                    type="button"
                >
                    📋 Copy All
                </button>

            </div>


            <div
                id="bioOutput"
                class="caption-output"
            >

                <div class="empty-script">

                    👤

                    <h3>
                        Your AI bios will appear here
                    </h3>

                    <p>
                        Enter your niche and generate bios.
                    </p>

                </div>

            </div>


            <button
                id="regenerateBtn"
                class="regenerate-btn"
                onclick="generateBio()"
                type="button"
            >
                🔄 Generate Again
            </button>


            <p
                id="copyMessage"
                class="copy-message"
            ></p>


        </div>


    </div>


    <a
        href="/creator-tools"
        class="back-dashboard"
    >
        ← Back to Creator Tools
    </a>


</main>



<script>


async function generateBio() {


    const platform =
        document
        .getElementById("platform")
        .value;


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const niche =
        document
        .getElementById("niche")
        .value
        .trim();


    const style =
        document
        .getElementById("style")
        .value;


    const extra =
        document
        .getElementById("extra")
        .value
        .trim();


    const output =
        document
        .getElementById("bioOutput");


    const generateBtn =
        document
        .getElementById("generateBtn");


    const regenerateBtn =
        document
        .getElementById("regenerateBtn");


    const copyMessage =
        document
        .getElementById("copyMessage");


    if (!niche) {

        alert(
            "Please enter your niche."
        );

        return;

    }


    generateBtn.disabled = true;

    regenerateBtn.disabled = true;


    generateBtn.textContent =
        "🤖 Generating...";


    output.innerHTML = `

        <div class="empty-script">

            🤖

            <h3>
                AI is creating your bios...
            </h3>

            <p>
                Please wait.
            </p>

        </div>

    `;


    copyMessage.textContent = "";


    try {


        const response =
            await fetch(
                "/api/generate-bio",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            platform:
                                platform,

                            username:
                                username,

                            niche:
                                niche,

                            style:
                                style,

                            extra:
                                extra

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Bio generation failed."
            );

        }


        output.textContent =
            data.bios;


    } catch (error) {


        output.innerHTML = `

            <div class="empty-script">

                ❌

                <h3>
                    Something went wrong
                </h3>

                <p>
                    ${error.message}
                </p>

            </div>

        `;


    } finally {


        generateBtn.disabled = false;

        regenerateBtn.disabled = false;

        generateBtn.textContent =
            "✨ Generate AI Bios";

    }

}



async function copyBios() {


    const output =
        document
        .getElementById("bioOutput");


    const text =
        output.textContent.trim();


    if (!text) {

        return;

    }


    try {


        await navigator
            .clipboard
            .writeText(text);


        document
        .getElementById(
            "copyMessage"
        )
        .textContent =
            "✓ Bios copied!";


    } catch (error) {


        document
        .getElementById(
            "copyMessage"
        )
        .textContent =
            "❌ Unable to copy.";

    }

}

</script>


</body>

</html>
