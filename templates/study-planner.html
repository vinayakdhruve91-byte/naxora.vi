<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXORA | AI Study Planner</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0, 150, 255, .15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 40%,
                    rgba(170, 60, 255, .14),
                    transparent 30%
                ),
                #03050d;

            overflow-x: hidden;
        }


        .container {
            width: min(1050px, 94%);

            margin: auto;

            padding:
                35px 0 100px;
        }


        /* BACK */

        .back {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            color:
                rgba(255,255,255,.65);

            text-decoration: none;

            font-size: 14px;

            margin-bottom: 30px;

            transition: .2s;
        }


        .back:hover {
            color: white;

            transform:
                translateX(-3px);
        }


        /* HERO */

        .hero {
            text-align: center;

            margin-bottom: 35px;
        }


        .icon {
            font-size: 58px;

            display: block;

            margin-bottom: 8px;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(150,80,255,.65)
                );
        }


        h1 {
            font-size:
                clamp(38px, 6vw, 58px);

            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #69caff,
                    #bd6cff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }


        .subtitle {
            margin-top: 9px;

            color:
                #7180d6;

            letter-spacing: 3px;

            font-size: 13px;

            font-weight: 700;
        }


        /* CARD */

        .planner {
            padding: 30px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.13);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.35),

                inset 0 1px 0
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(18px);
        }


        /* FORM */

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .field {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .full {
            grid-column: 1 / -1;
        }


        label {
            font-size: 13px;

            color:
                rgba(255,255,255,.65);

            font-weight: 700;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding:
                13px 14px;

            border-radius: 12px;

            outline: none;

            color: white;

            background:
                rgba(3,7,25,.85);

            border:
                1px solid
                rgba(255,255,255,.12);

            font-size: 14px;

            transition: .2s;
        }


        input,
        select {
            height: 50px;
        }


        textarea {
            min-height: 120px;

            resize: vertical;

            line-height: 1.5;
        }


        input::placeholder,
        textarea::placeholder {
            color:
                rgba(255,255,255,.35);
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                #6b9dff;

            box-shadow:
                0 0 20px
                rgba(60,130,255,.14);
        }


        select option {
            background:
                #0b0e22;

            color: white;
        }


        /* BUTTON */

        .generate-btn {

            width: 100%;

            height: 55px;

            margin-top: 25px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            color: white;

            font-size: 16px;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #168dff,
                    #713cff,
                    #b43cff
                );

            box-shadow:
                0 12px 30px
                rgba(80,80,255,.25);

            transition: .2s;
        }


        .generate-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 18px 40px
                rgba(80,80,255,.38);
        }


        .generate-btn:disabled {
            opacity: .55;

            cursor:
                not-allowed;

            transform: none;
        }


        /* LOADING */

        .loading {

            display: none;

            text-align: center;

            margin-top: 24px;

            color:
                #7ecbff;

            font-size: 14px;
        }


        .spinner {

            display: inline-block;

            width: 20px;
            height: 20px;

            margin-right: 8px;

            vertical-align: middle;

            border:
                3px solid
                rgba(255,255,255,.15);

            border-top-color:
                #50baff;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* ERROR */

        .error {

            display: none;

            margin-top: 20px;

            padding: 14px;

            border-radius: 12px;

            color:
                #ff9da8;

            background:
                rgba(255,60,80,.08);

            border:
                1px solid
                rgba(255,60,80,.20);
        }


        /* RESULT */

        .result {

            display: none;

            margin-top: 30px;
        }


        .result-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            margin-bottom: 18px;
        }


        .result-header h2 {

            font-size: 23px;

            color:
                #8fd8ff;
        }


        .badge {

            padding:
                8px 13px;

            border-radius: 10px;

            color:
                #bd9aff;

            background:
                rgba(100,70,255,.12);

            border:
                1px solid
                rgba(120,100,255,.25);

            font-size: 12px;
        }


        /* DAY */

        .day {

            margin-bottom: 16px;

            padding: 22px;

            border-radius: 19px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.09);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,.18);
        }


        .day-title {

            color:
                #73c8ff;

            font-size: 17px;

            font-weight: 800;

            margin-bottom: 13px;
        }


        .task {

            padding:
                11px 13px;

            margin-top: 8px;

            border-radius: 10px;

            color:
                rgba(255,255,255,.75);

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.07);

            line-height: 1.5;
        }


        /* DEV */

        .dev-credit {

            position: fixed;

            right: 17px;

            bottom: 7px;

            font-size: 10px;

            font-weight: 800;

            font-style: italic;

            letter-spacing: 1px;

            color:
                #dc8cff;

            text-shadow:
                0 0 5px #a52fff,
                0 0 12px #ff32d0;

            animation:
                glow 2s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes glow {

            from {
                opacity: .45;
            }

            to {
                opacity: 1;
            }

        }


        @media(max-width:700px) {

            .container {
                width: 92%;
            }

            .planner {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .result-header {
                flex-direction: column;

                align-items:
                    flex-start;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <a
        href="/student-tools"
        class="back"
    >
        ← Back to AI Study Tools
    </a>


    <!-- HERO -->

    <header class="hero">

        <span class="icon">
            📋
        </span>

        <h1>
            AI Study Planner
        </h1>

        <p class="subtitle">
            Plan Smart • Study Better • Achieve More
        </p>

    </header>


    <!-- PLANNER -->

    <div class="planner">


        <div class="form-grid">


            <div class="field">

                <label>
                    Your Exam / Goal
                </label>

                <input
                    id="goal"
                    type="text"
                    placeholder="e.g. CGPSC Preparation"
                >

            </div>


            <div class="field">

                <label>
                    Exam Date
                </label>

                <input
                    id="examDate"
                    type="date"
                >

            </div>


            <div class="field">

                <label>
                    Daily Study Hours
                </label>

                <select id="hours">

                    <option value="2">
                        2 Hours
                    </option>

                    <option value="3">
                        3 Hours
                    </option>

                    <option value="4" selected>
                        4 Hours
                    </option>

                    <option value="5">
                        5 Hours
                    </option>

                    <option value="6">
                        6 Hours
                    </option>

                    <option value="8">
                        8 Hours
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Study Level
                </label>

                <select id="level">

                    <option value="Beginner">
                        🟢 Beginner
                    </option>

                    <option value="Intermediate" selected>
                        🟡 Intermediate
                    </option>

                    <option value="Advanced">
                        🔴 Advanced
                    </option>

                </select>

            </div>


            <div class="field full">

                <label>
                    Subjects
                </label>

                <textarea
                    id="subjects"
                    placeholder="Example:
History
Geography
Political Science
Current Affairs"
                ></textarea>

            </div>


            <div class="field full">

                <label>
                    Extra Instructions
                </label>

                <input
                    id="instructions"
                    type="text"
                    placeholder="e.g. Give more time to weak subjects"
                >

            </div>


        </div>


        <button
            id="generateBtn"
            class="generate-btn"
            onclick="generatePlan()"
        >
            ✨ Create My Study Plan
        </button>


        <div
            id="loading"
            class="loading"
        >

            <span class="spinner"></span>

            AI is creating your personalized plan...

        </div>


        <div
            id="error"
            class="error"
        ></div>


        <!-- RESULT -->

        <div
            id="result"
            class="result"
        >

            <div class="result-header">

                <h2>
                    🗓️ Your AI Study Plan
                </h2>

                <div
                    id="planBadge"
                    class="badge"
                ></div>

            </div>


            <div
                id="plan"
            ></div>

        </div>


    </div>


</div>



<div class="dev-credit">
    dev-vinayak
</div>



<script>

async function generatePlan() {


    const goal =
        document
            .getElementById("goal")
            .value
            .trim();


    const examDate =
        document
            .getElementById("examDate")
            .value;


    const hours =
        document
            .getElementById("hours")
            .value;


    const level =
        document
            .getElementById("level")
            .value;


    const subjects =
        document
            .getElementById("subjects")
            .value
            .trim();


    const instructions =
        document
            .getElementById("instructions")
            .value
            .trim();


    const button =
        document
            .getElementById("generateBtn");


    const loading =
        document
            .getElementById("loading");


    const errorBox =
        document
            .getElementById("error");


    const result =
        document
            .getElementById("result");


    errorBox.style.display =
        "none";


    result.style.display =
        "none";


    if (!goal || !subjects) {

        errorBox.textContent =
            "Please enter your goal and subjects.";

        errorBox.style.display =
            "block";

        return;
    }


    button.disabled =
        true;

    loading.style.display =
        "block";


    const prompt = `

You are NEXORA AI, an expert study planner.

Create a practical personalized study timetable.

Goal:
${goal}

Exam Date:
${examDate || "Not specified"}

Daily Study Hours:
${hours}

Study Level:
${level}

Subjects:
${subjects}

Extra Instructions:
${instructions || "None"}

Rules:

1. Make the plan realistic.
2. Divide time between all subjects.
3. Give extra attention to difficult subjects.
4. Include revision.
5. Include short breaks.
6. Do not make the schedule impossible.
7. Give a clear day-wise plan.
8. Keep each day's plan easy to understand.

Return exactly in this format:

DAY 1

09:00 - 10:00 | Subject | Topic
10:00 - 10:15 | Break
10:15 - 11:15 | Subject | Topic
11:15 - 12:00 | Revision

DAY 2

09:00 - 10:00 | Subject | Topic
...

Continue with a useful study plan.

`;


    try {


        const response =
            await fetch(
                "/api/ai-test",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            prompt: prompt
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message
                ||
                "AI request failed."
            );

        }


        if (!data.success) {

            throw new Error(
                data.message
                ||
                "AI could not create the plan."
            );

        }


        renderPlan(
            data.response || ""
        );


        document
            .getElementById("planBadge")
            .textContent =
                `${hours} hours/day`;


        result.style.display =
            "block";


    }

    catch (error) {

        errorBox.textContent =
            error.message
            ||
            "Something went wrong.";

        errorBox.style.display =
            "block";

    }

    finally {

        button.disabled =
            false;

        loading.style.display =
            "none";

    }

}



function renderPlan(text) {


    const planBox =
        document.getElementById(
            "plan"
        );


    planBox.innerHTML =
        "";


    const days =
        text
            .split(
                /(?=DAY\s+\d+)/i
            )
            .filter(
                day =>
                    day.trim()
            );


    if (!days.length) {

        const day =
            document.createElement(
                "div"
            );

        day.className =
            "day";


        const task =
            document.createElement(
                "div"
            );

        task.className =
            "task";

        task.textContent =
            text;

        day.appendChild(
            task
        );

        planBox.appendChild(
            day
        );

        return;
    }


    days.forEach(
        (dayText, index) => {


            const lines =
                dayText
                    .trim()
                    .split("\n")
                    .map(
                        line =>
                            line.trim()
                    )
                    .filter(
                        line =>
                            line
                    );


            const day =
                document.createElement(
                    "div"
                );

            day.className =
                "day";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "day-title";


            title.textContent =
                lines[0]
                ||
                `DAY ${index + 1}`;


            day.appendChild(
                title
            );


            lines
                .slice(1)
                .forEach(
                    line => {

                        const task =
                            document.createElement(
                                "div"
                            );

                        task.className =
                            "task";

                        task.textContent =
                            line;

                        day.appendChild(
                            task
                        );

                    }
                );


            planBox.appendChild(
                day
            );

        }
    );

}

</script>


</body>

</html>
