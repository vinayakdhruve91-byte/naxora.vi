<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXORA | AI MCQ Generator</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0, 150, 255, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 40%,
                    rgba(160, 60, 255, 0.14),
                    transparent 30%
                ),
                #03050d;

            overflow-x: hidden;
        }


        /* =========================
           MAIN
        ========================== */

        .container {
            width: min(1050px, 94%);

            margin: auto;

            padding:
                35px 0 100px;
        }


        /* =========================
           BACK
        ========================== */

        .back {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            color:
                rgba(255,255,255,.65);

            text-decoration: none;

            font-size: 14px;

            margin-bottom: 30px;

            transition: .2s;
        }


        .back:hover {
            color: white;

            transform:
                translateX(-3px);
        }


        /* =========================
           HEADER
        ========================== */

        .hero {
            text-align: center;

            margin-bottom: 35px;
        }


        .robot {
            font-size: 58px;

            display: block;

            margin-bottom: 8px;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(40,180,255,.65)
                );
        }


        h1 {
            font-size:
                clamp(38px, 6vw, 58px);

            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #58c9ff,
                    #b86cff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }


        .subtitle {
            margin-top: 9px;

            color:
                #7180d6;

            letter-spacing: 3px;

            font-size: 13px;

            font-weight: 700;
        }


        /* =========================
           GENERATOR CARD
        ========================== */

        .generator {
            padding: 30px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.13);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.35),

                inset 0 1px 0
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(18px);
        }


        /* =========================
           FORM GRID
        ========================== */

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .field {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .field.full {
            grid-column: 1 / -1;
        }


        label {
            font-size: 13px;

            color:
                rgba(255,255,255,.65);

            font-weight: 700;
        }


        input,
        select {

            width: 100%;

            height: 50px;

            padding:
                0 14px;

            border-radius: 12px;

            outline: none;

            color: white;

            background:
                rgba(3,7,25,.85);

            border:
                1px solid
                rgba(255,255,255,.12);

            font-size: 14px;

            transition: .2s;
        }


        input::placeholder {
            color:
                rgba(255,255,255,.35);
        }


        input:focus,
        select:focus {

            border-color:
                #5b9dff;

            box-shadow:
                0 0 20px
                rgba(50,140,255,.14);
        }


        select option {
            background:
                #0b0e22;

            color: white;
        }


        /* =========================
           GENERATE BUTTON
        ========================== */

        .generate-btn {

            width: 100%;

            height: 55px;

            margin-top: 25px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            color: white;

            font-size: 16px;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #168dff,
                    #713cff,
                    #b43cff
                );

            box-shadow:
                0 12px 30px
                rgba(80,80,255,.25);

            transition:
                transform .2s,
                box-shadow .2s;
        }


        .generate-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 18px 40px
                rgba(80,80,255,.38);
        }


        .generate-btn:disabled {

            opacity: .55;

            cursor:
                not-allowed;

            transform: none;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {

            display: none;

            text-align: center;

            margin-top: 25px;

            color:
                #7ecbff;

            font-size: 14px;
        }


        .spinner {

            display: inline-block;

            width: 20px;
            height: 20px;

            margin-right: 8px;

            vertical-align: middle;

            border:
                3px solid
                rgba(255,255,255,.15);

            border-top-color:
                #50baff;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =========================
           RESULT
        ========================== */

        .result {

            display: none;

            margin-top: 30px;
        }


        .result-title {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 18px;
        }


        .result-title h2 {

            font-size: 23px;

            color:
                #8fd8ff;
        }


        .score {

            padding:
                8px 13px;

            border-radius: 10px;

            background:
                rgba(100,70,255,.12);

            border:
                1px solid
                rgba(120,100,255,.25);

            color:
                #bd9aff;

            font-size: 13px;
        }


        /* =========================
           QUESTION CARD
        ========================== */

        .question {

            padding: 22px;

            margin-bottom: 16px;

            border-radius: 19px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.09);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,.18);
        }


        .question-number {

            color:
                #6dbfff;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 9px;
        }


        .question-text {

            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 17px;
        }


        .answer {

            padding:
                11px 14px;

            margin-top: 8px;

            border-radius: 10px;

            color:
                rgba(255,255,255,.75);

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.07);
        }


        .answer.correct {

            color:
                #7cff9c;

            border-color:
                rgba(70,255,130,.30);

            background:
                rgba(60,255,120,.07);
        }


        /* =========================
           ERROR
        ========================== */

        .error {

            display: none;

            margin-top: 20px;

            padding: 14px;

            border-radius: 12px;

            color:
                #ff9da8;

            background:
                rgba(255,60,80,.08);

            border:
                1px solid
                rgba(255,60,80,.20);
        }


        /* =========================
           DEV
        ========================== */

        .dev-credit {

            position: fixed;

            right: 17px;

            bottom: 7px;

            font-size: 10px;

            font-weight: 800;

            font-style: italic;

            letter-spacing: 1px;

            color:
                #dc8cff;

            text-shadow:
                0 0 5px #a52fff,
                0 0 12px #ff32d0;

            animation:
                glow 2s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes glow {

            from {
                opacity: .45;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media(max-width: 700px) {

            .container {
                width: 92%;
            }

            .generator {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .result-title {
                flex-direction: column;

                align-items:
                    flex-start;

                gap: 10px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <a
        href="/student-tools"
        class="back"
    >
        ← Back to AI Study Tools
    </a>



    <!-- HEADER -->

    <header class="hero">

        <span class="robot">
            🤖
        </span>

        <h1>
            AI MCQ Generator
        </h1>

        <p class="subtitle">
            Learn • Practice • Improve
        </p>

    </header>



    <!-- GENERATOR -->

    <div class="generator">


        <div class="form-grid">


            <div class="field">

                <label>
                    Subject
                </label>

                <input
                    id="subject"
                    type="text"
                    placeholder="e.g. History"
                >

            </div>



            <div class="field">

                <label>
                    Topic
                </label>

                <input
                    id="topic"
                    type="text"
                    placeholder="e.g. Mauryan Empire"
                >

            </div>



            <div class="field">

                <label>
                    Language
                </label>

                <select id="language">

                    <option value="Hindi">
                        🇮🇳 Hindi
                    </option>

                    <option value="English">
                        🇬🇧 English
                    </option>

                    <option value="Hinglish">
                        💬 Hinglish
                    </option>

                </select>

            </div>



            <div class="field">

                <label>
                    Number of Questions
                </label>

                <select id="count">

                    <option value="5">
                        5 Questions
                    </option>

                    <option value="10">
                        10 Questions
                    </option>

                    <option value="15">
                        15 Questions
                    </option>

                    <option value="20">
                        20 Questions
                    </option>

                </select>

            </div>



            <div class="field full">

                <label>
                    Difficulty
                </label>

                <select id="difficulty">

                    <option value="Easy">
                        🟢 Easy
                    </option>

                    <option value="Medium" selected>
                        🟡 Medium
                    </option>

                    <option value="Hard">
                        🔴 Hard
                    </option>

                </select>

            </div>


        </div>



        <button
            id="generateBtn"
            class="generate-btn"
            onclick="generateMCQs()"
        >
            ✨ Generate MCQs
        </button>


        <div
            id="loading"
            class="loading"
        >

            <span class="spinner"></span>

            AI is generating your questions...

        </div>


        <div
            id="error"
            class="error"
        ></div>



        <!-- RESULTS -->

        <div
            id="result"
            class="result"
        >

            <div class="result-title">

                <h2>
                    📝 Generated Questions
                </h2>

                <div
                    id="questionCount"
                    class="score"
                ></div>

            </div>


            <div
                id="questions"
            ></div>

        </div>


    </div>


</div>



<div class="dev-credit">
    dev-vinayak
</div>



<script>

async function generateMCQs() {


    const subject =
        document
            .getElementById("subject")
            .value
            .trim();


    const topic =
        document
            .getElementById("topic")
            .value
            .trim();


    const language =
        document
            .getElementById("language")
            .value;


    const count =
        document
            .getElementById("count")
            .value;


    const difficulty =
        document
            .getElementById("difficulty")
            .value;


    const button =
        document
            .getElementById("generateBtn");


    const loading =
        document
            .getElementById("loading");


    const errorBox =
        document
            .getElementById("error");


    const result =
        document
            .getElementById("result");


    const questionsBox =
        document
            .getElementById("questions");


    const countBox =
        document
            .getElementById("questionCount");


    errorBox.style.display =
        "none";


    result.style.display =
        "none";


    if (!subject || !topic) {

        errorBox.textContent =
            "Please enter both subject and topic.";

        errorBox.style.display =
            "block";

        return;
    }


    button.disabled =
        true;


    loading.style.display =
        "block";


    const prompt = `

You are NEXORA AI, an educational MCQ generator.

Generate exactly ${count} multiple-choice questions.

Subject: ${subject}

Topic: ${topic}

Language: ${language}

Difficulty: ${difficulty}

Rules:

1. Every question must have exactly 4 options.
2. Only one option must be correct.
3. Questions must be educational and factually accurate.
4. Do not repeat questions.
5. Use the requested language.
6. At the end of every question clearly provide the correct answer.
7. Keep explanations short.

Return the response in this exact format:

Q1. Question

A) Option
B) Option
C) Option
D) Option

ANSWER: A

EXPLANATION: Short explanation.

Q2. Question

A) Option
B) Option
C) Option
D) Option

ANSWER: B

EXPLANATION: Short explanation.

Continue until ${count} questions are complete.

`;


    try {


        const response =
            await fetch(
                "/api/ai-test",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            prompt: prompt
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message
                ||
                "AI request failed."
            );

        }


        if (!data.success) {

            throw new Error(
                data.message
                ||
                "AI could not generate questions."
            );

        }


        const text =
            data.response
            ||
            "";


        renderQuestions(text);


        countBox.textContent =
            `${count} Questions`;


        result.style.display =
            "block";


    }

    catch (error) {

        errorBox.textContent =
            error.message
            ||
            "Something went wrong.";

        errorBox.style.display =
            "block";

    }

    finally {

        button.disabled =
            false;

        loading.style.display =
            "none";

    }

}



function renderQuestions(text) {


    const container =
        document.getElementById(
            "questions"
        );


    container.innerHTML =
        "";


    const blocks =
        text
            .split(
                /(?=Q\d+\.)/i
            )
            .filter(
                block =>
                    block.trim()
            );


    if (!blocks.length) {

        const fallback =
            document.createElement(
                "div"
            );

        fallback.className =
            "question";


        fallback.textContent =
            text;


        container.appendChild(
            fallback
        );

        return;
    }


    blocks.forEach(
        (block, index) => {


            const lines =
                block
                    .trim()
                    .split("\n")
                    .map(
                        line =>
                            line.trim()
                    )
                    .filter(
                        line =>
                            line
                    );


            const question =
                document.createElement(
                    "div"
                );


            question.className =
                "question";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "question-number";


            number.textContent =
                `QUESTION ${index + 1}`;


            question.appendChild(
                number
            );


            let answerFound =
                false;


            lines
                .slice(0, 1)
                .forEach(
                    line => {

                        const q =
                            document.createElement(
                                "div"
                            );

                        q.className =
                            "question-text";

                        q.textContent =
                            line.replace(
                                /^Q\d+\.\s*/i,
                                ""
                            );

                        question.appendChild(
                            q
                        );

                    }
                );


            lines
                .slice(1)
                .forEach(
                    line => {

                        if (
                            /^ANSWER:/i
                                .test(line)
                        ) {

                            answerFound =
                                true;


                            const answer =
                                document.createElement(
                                    "div"
                                );


                            answer.className =
                                "answer correct";


                            answer.textContent =
                                "✅ " +
                                line;


                            question.appendChild(
                                answer
                            );

                        }

                        else if (
                            /^EXPLANATION:/i
                                .test(line)
                        ) {

                            const explanation =
                                document.createElement(
                                    "div"
                                );


                            explanation.className =
                                "answer";


                            explanation.textContent =
                                "💡 " +
                                line;


                            question.appendChild(
                                explanation
                            );

                        }

                        else {

                            const option =
                                document.createElement(
                                    "div"
                                );


                            option.className =
                                "answer";


                            option.textContent =
                                line;


                            question.appendChild(
                                option
                            );

                        }

                    }
                );


            container.appendChild(
                question
            );

        }
    );

}

</script>


</body>

</html>
